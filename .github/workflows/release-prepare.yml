name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
      - name: Install vampus
        run: cargo install vampus --git https://github.com/atareao/vampus
      - name: Determine bump type from commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
          COMMITS=$(git log "$LAST_TAG"..HEAD --format="%s")
          # Gitmoji-aware: los commits empiezan por emoji (✨ feat, 🐛 fix, 💥 breaking).
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|💥|!:"; then
            type=--major
          elif echo "$COMMITS" | grep -qE "^✨|^feat"; then
            type=--minor
          else
            type=--patch
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
      - name: Bump version with vampus
        run: vampus upgrade ${{ steps.bump.outputs.type }}
      - name: Refresh Cargo.lock
        # vampus solo reescribe Cargo.toml. Si Cargo.lock se queda desfasado,
        # `cargo publish` lo regenera al vuelo, lo detecta como cambio sin
        # commitear y aborta con "files in the working directory contain changes".
        run: cargo update --workspace
      - name: Get new version
        id: version
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: Generate changelog
        run: git-cliff -o CHANGELOG.md --tag "v${{ steps.version.outputs.value }}"
      - name: Commit, tag and push
        run: |
          V="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release v${V}"
          git tag "v${V}"
          git push origin main
          git push origin "v${V}"
      - name: Sync development with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/development \
            -f sha=$(git rev-parse HEAD) \
            -F force=true

  # Llama al workflow reutilizable en lugar de depender de que el push del tag
  # dispare release.yml (los pushes hechos con GITHUB_TOKEN no disparan workflows).
  # Así no hace falta ningún PAT: basta con el GITHUB_TOKEN (contents: write).
  release:
    needs: [prepare]
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
      publish: true
    # En workflows reutilizables los secretos NO se heredan solos:
    # sin esto, CARGO_REGISTRY_TOKEN llega vacío y `publish` se omite.
    secrets: inherit
