name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a compilar y publicar (p.ej. v0.2.7)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag a compilar y publicar"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare archive
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/graphrag${{ matrix.ext }}"
          ARCHIVE_NAME="graphrag${{ matrix.ext }}"
          cp "$BIN" "$ARCHIVE_NAME"
          PKG="graphrag-${{ matrix.target }}"
          tar czf "$PKG.tar.gz" "$ARCHIVE_NAME"
          echo "ARTIFACT=$PKG.tar.gz" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graphrag-*
          merge-multiple: true
      - name: Generate release body
        run: |
          cat > notes.md <<'BODY'
          ## graphrag

          ### Downloads

          | Architecture | File |
          |---|---|
          BODY
          for f in *.*; do
            [[ "$f" == *.md ]] && continue
            [[ "$f" == *.txt ]] && continue
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed 's/^graphrag-//; s/\.tar\.gz$//; s/\.zip$//')
            echo "| \`$arch\` | \`$f\` |" >> notes.md
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: graphrag ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: |
            *.tar.gz
          generate_release_notes: true

  # NOTA: el job `publish` a crates.io se eliminó a propósito.
  # El nombre `graphrag` en crates.io pertenece a OTRO proyecto
  # (https://github.com/automataIA/graphrag-rs), así que `cargo publish`
  # siempre fallaba. La distribución es vía GitHub Releases.
  # Si algún día se quiere publicar, hay que renombrar el crate en Cargo.toml
  # y volver a añadir un job `publish` con CARGO_REGISTRY_TOKEN.
