name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a compilar y publicar (p.ej. v0.3.0)"
        required: true
        type: string
      publish:
        description: "Publicar también en crates.io"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Tag a compilar y publicar"
        required: true
        type: string
      publish:
        description: "Publicar también en crates.io"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare archive
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/graphrag${{ matrix.ext }}"
          ARCHIVE_NAME="graphrag${{ matrix.ext }}"
          cp "$BIN" "$ARCHIVE_NAME"
          PKG="graphrag-${{ matrix.target }}"
          tar czf "$PKG.tar.gz" "$ARCHIVE_NAME"
          echo "ARTIFACT=$PKG.tar.gz" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphrag-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graphrag-*
          merge-multiple: true
      - name: Generate release body
        run: |
          cat > notes.md <<'BODY'
          ## graphrag

          ### Downloads

          | Architecture | File |
          |---|---|
          BODY
          for f in *.*; do
            [[ "$f" == *.md ]] && continue
            [[ "$f" == *.txt ]] && continue
            [ -f "$f" ] || continue
            arch=$(echo "$f" | sed 's/^graphrag-//; s/\.tar\.gz$//; s/\.zip$//')
            echo "| \`$arch\` | \`$f\` |" >> notes.md
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: graphrag ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: |
            *.tar.gz
          generate_release_notes: true

  # Publicación en crates.io.
  # El PAQUETE se llama `graphrag-search` porque el nombre `graphrag` está ocupado
  # por otro proyecto (https://github.com/automataIA/graphrag-rs), pero el BINARIO
  # sigue llamándose `graphrag` (ver [[bin]] en Cargo.toml). Instalación:
  #   cargo install graphrag-search
  #
  # El job se salta a sí mismo (con aviso, sin fallar) si:
  #   - no está configurado el secreto CARGO_REGISTRY_TOKEN, o
  #   - la versión ya estaba publicada en crates.io.
  publish:
    name: crates.io
    needs: [build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN no está configurado; se omite la publicación en crates.io."
            exit 0
          fi
          set +e
          OUT=$(cargo publish --token "$CARGO_REGISTRY_TOKEN" 2>&1)
          STATUS=$?
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUT" | grep -qiE "already (uploaded|exists)"; then
              echo "::warning::La versión ya estaba publicada en crates.io; se considera éxito."
              exit 0
            fi
            exit $STATUS
          fi
