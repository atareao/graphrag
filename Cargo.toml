[package]
name = "graphrag"
version = "0.2.0"
edition = "2021"
description = "GraphRAG — Hybrid search engine: vector embeddings + knowledge graph over Markdown notes. 100% local, single Rust binary."
authors = ["atareao <lorenzo@atareao.es>"]
license = "MIT"
repository = "https://github.com/atareao/graphrag"
homepage = "https://github.com/atareao/graphrag"
keywords = ["graphrag", "search", "embeddings", "knowledge-graph", "rag", "markdown", "ollama", "semantic-search"]
categories = ["command-line-utilities", "database", "text-processing"]
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# SQLite (bundled = SQLite compilado estáticamente, sin dependencias externas)
rusqlite = { version = "0.40", features = ["bundled", "vtab"] }

# HTTP client for Ollama
reqwest = { version = "0.13", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Vector ops (float32 <-> bytes)
bytemuck = "1"

# Text processing
regex = "1"
unicode-normalization = "0.1"

# Directory traversal
walkdir = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Colores y progreso
termcolor = "1"
indicatif = "0.18"

# Random (for synthetic embeddings)
rand = "0.10"

# Ordered HashMap (for predictable iteration)
indexmap = "2"
sha2 = "0.11.0"

# Community detection (Leiden algorithm)
leiden-rs = { version = "0.8.1", features = ["petgraph"] }

# Config (TOML)
toml = "1.1"
dirs = "7"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
